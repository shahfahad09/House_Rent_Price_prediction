<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>House Rent Prediction</title>
    <style>
        /* Background image with overlay */
        body {
          margin: 0;
    background: 
        /* linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), */
        url('/static/images/house3.jpg') no-repeat left center fixed;
    background-size: 1060px auto;
    background-repeat: no-repeat;
    color: rgb(255, 255, 255);
    height: 100vh;
    display: flex;
    justify-content: flex-end;
    align-items: center;
}

        .container {
           height: 800px;
            background: #413735;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.826);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(8px);
            max-width: 400px;
            width: 100%;
            margin-left: 10px;
            /* display: flex; */
            position: fixed;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 1.2px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: none;
            outline: none;
            font-size: 1rem;
        }

        input[type="submit"] {
            background-color: #007bff;
            color: rgb(255, 255, 255);
            font-weight: 700;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 1.2rem;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>House Rent Prediction</h1>
        <form id="rentForm">
            <label for="bhk">Number of BHK</label>
            <input type="number" id="bhk" name="bhk" min="1" max="10" required />

            <label for="size">Size (in Sq.Ft)</label>
            <input type="number" id="size" name="size" min="10" required />

            <label for="area_type">Area Type</label>
            <select id="area_type" name="area_type" required>
                <option value="" disabled selected>Select Area Type</option>
                <option value="1">Super Area</option>
                <option value="2">Carpet Area</option>
                <option value="3">Built Area</option>
            </select>

            <label for="city">Select City </label>
            <select id="city" name="city" required>
                <option value="" disabled selected>Select City</option>
                <option value="4000">Mumbai</option>
                <option value="6000">Chennai</option>
                <option value="5600">Bangalore</option>
                <option value="5000">Hyderabad</option>
                <option value="1100">Delhi</option>
                <option value="7000">Kolkata</option>
            </select>

            <label for="furnishing_status">Furnishing Status</label>
            <select id="furnishing_status" name="furnishing_status" required>
                <option value="" disabled selected>Select Furnishing Status</option>
                <option value="0">Unfurnished</option>
                <option value="1">Semi-Furnished</option>
                <option value="2">Furnished</option>
            </select>

            <label for="tenant_preferred">Tenant Type</label>
            <select id="tenant_preferred" name="tenant_preferred" required>
                <option value="" disabled selected>Select Tenant Type</option>
                <option value="1">Bachelors</option>
                <option value="2">Bachelors/Family</option>
                <option value="3">Family</option>
            </select>

            <label for="bathroom">Number of Bathrooms</label>
            <input type="number" id="bathroom" name="bathroom" min="1" max="10" required />

            <input type="submit" value="Predict Rent" />
        </form>

        <div id="result"></div>
    </div>

    <script>
        const form = document.getElementById('rentForm');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => (data[key] = value));

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: new URLSearchParams(data),
                });

                const result = await response.json();

                if (result.predicted_rent) {
                    resultDiv.innerHTML = `<p>Predicted Rent: <strong>₹${result.predicted_rent}</strong></p>`;
                } else if (result.error) {
                    resultDiv.innerHTML = `<p style="color: #ff6347;">Error: ${result.error}</p>`;
                } else {
                    resultDiv.innerHTML = `<p style="color: #ff6347;">Unexpected error occurred</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: #ff6347;">Failed to fetch prediction.</p>`;
            }
        });
    </script>
</body>
</html>
